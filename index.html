<!doctype html><html lang="vi"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Bản đồ hệ thống điện HPDQ</title><link rel="stylesheet" href="https://unpkg.com/leaflet@1.9.4/dist/leaflet.css"><link rel="stylesheet" href="style.css"></head><body>
<header><div><strong>BẢN ĐỒ HỆ THỐNG ĐIỆN KLH HPDQ</strong><small>Quản lý trạm điện • Tuyến cáp 110–35 kV</small></div><div class="actions"><span id="status">V1.1 • Đang kết nối</span><button id="adminBtn" disabled>Chế độ chỉnh sửa</button></div><link rel="icon" type="image/png" href="./Logo.png"></header>
<div class="layout" id="layout"><aside id="sidebar"><h3>TRẠM ĐIỆN</h3><input id="search" placeholder="Tìm tên trạm..."><div id="stationList"></div><label class="label-choice">Tên ghim <select id="labelMode"><option value="always">Luôn hiện</option><option value="hover">Khi rê chuột</option><option value="none">Ẩn tên</option></select></label><hr><h3>LỚP BẢN ĐỒ</h3><label><input type="checkbox" id="showStations" checked> Ghim trạm</label><label><input type="checkbox" id="showRoutes" checked> Tuyến đã chọn</label><button id="showAll">Hiện tất cả tuyến</button><button id="hideAll">Ẩn tất cả tuyến</button><hr><section id="editTools" hidden><h3>QUẢN TRỊ BẢN ĐỒ</h3><p>Vẽ tuyến và lưu từng đối tượng trên Firebase.</p><button id="addStation">+ Thêm trạm</button><button id="moveStation">Di chuyển ghim trạm</button><button id="drawRoute">+ Vẽ tuyến cáp</button><label class="label-choice">Màu tuyến cáp <input type="color" id="routeColor" value="#08a6ed"></label><div class="edit-row"><button id="undoBtn" title="Ctrl+Z">↶ Hoàn tác</button><button id="redoBtn" title="Ctrl+Y">↷ Làm lại</button></div><button id="editRoute">Sửa điểm tuyến</button><button id="finishRoute" hidden>Hoàn tất vẽ</button><button id="cancelAction">Hủy thao tác</button><hr><button id="exportBtn" class="owner-only">Xuất bản sao JSON</button><label class="upload owner-only">Nhập bản sao JSON<input type="file" id="importFile" accept="application/json,.json" hidden></label><button id="clearBtn" class="danger owner-only">Xóa dữ liệu bản đồ</button></section></aside><main><button id="toggleSidebar" class="floating-toggle" title="Ẩn/hiện thanh bên">☰</button><div class="view-switch"><button id="normalView" class="active">Bản đồ tổng mặt bằng</button><button id="cableView">Chỉ tuyến cáp</button></div><div id="map"></div><div id="gallery" class="gallery" hidden><div class="gallery-head"><b id="galleryTitle">Hình ảnh trạm</b><div><button id="galleryAll">Xem tất cả</button><button id="galleryClose">✕</button></div></div><div id="galleryContent"></div><div class="gallery-nav"><button id="galleryPrev">❮ Trước</button><span id="galleryCount"></span><button id="galleryNext">Tiếp ❯</button></div></div><div id="hint">Chọn ghim trạm để xem ảnh / chi tiết và bật tuyến cấp nguồn.</div></main></div>
<div id="modal" class="modal" hidden><div class="dialog"><div class="modalhead"><h2 id="modalTitle"></h2><button id="closeModal">✕</button></div><div id="modalBody"></div></div></div>
<script src="https://unpkg.com/leaflet@1.9.4/dist/leaflet.js"></script><script src="app.js"></script><script type="module" src="firebase-bridge.js"></script></body></html>
